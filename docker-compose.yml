version: '3.8'

services:
  # =========================================================================
  # =========================================================================
  # PartyHub Live WebSocket Server (Echtzeit-Synchronisation aller Geräte)
  # =========================================================================
  party-server:
    build:
      context: ./party-server
      dockerfile: Dockerfile
    container_name: party-server
    restart: unless-stopped
    environment:
      # Signiert Spiel-Tickets (Host-Nachweis). start.sh legt den Wert in .env an.
      - TREFFEN_TICKET_SECRET=${TREFFEN_TICKET_SECRET:-}
    ports:
      - "3001:3001"
    networks:
      - party-net

  # =========================================================================
  # PartyHub Hauptseite (Lobby, Raum-Verwaltung, synchroner Start)
  # =========================================================================
  partyhub:
    build:
      context: ./party-hub
      dockerfile: Dockerfile
    container_name: partyhub
    restart: unless-stopped
    ports:
      - "8000:80"
      - "3443:443"
    volumes:
      - ./party-hub:/usr/share/nginx/html:ro
      - ./letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - party-server
    networks:
      - party-net

  # =========================================================================
  # Spiel 1: skribbl (Zeichnen & Raten in Go)
  # =========================================================================
  skribbl:
    build:
      context: ./games/skribbl
      dockerfile: linux.Dockerfile
    container_name: skribbl
    restart: unless-stopped
    environment:
      - ROOT_PATH=/skribbl
      - CLIENTS_PER_IP_LIMIT=24
      # Hub-Tickets: daraus kommt der Avatar des Spielers
      - TREFFEN_TICKET_SECRET=${TREFFEN_TICKET_SECRET:-}
    ports:
      - "8080:8080"
    networks:
      - party-net

  # =========================================================================
  # Spiel 2: UNO / SunoS (Karten-Klassiker in Node.js)
  # =========================================================================
  uno:
    build:
      context: ./games/uno
      dockerfile: Dockerfile
    container_name: uno
    restart: unless-stopped
    environment:
      - PORT=8085
    volumes:
      - ./games/uno/client:/app/client:ro
    ports:
      - "8086:8085"
    networks:
      - party-net

  # =========================================================================
  # Spiel 3: Codenames (Geheimdienst-Worträtsel in Python/Flask)
  # =========================================================================
  codenames:
    build:
      context: ./games/codenames
      dockerfile: Dockerfile
    container_name: codenames
    restart: unless-stopped
    ports:
      - "5005:5000"
    networks:
      - party-net

  # =========================================================================
  # Spiel 4: Guess The Price - Backend (Express + Prisma/SQLite + WebSockets)
  # Schema wird beim Start per "prisma db push" angelegt und neu befüllt
  # =========================================================================
  gtp-server:
    build:
      context: ./games/guess-the-price/apps/server
      dockerfile: Dockerfile
    container_name: gtp-server
    restart: unless-stopped
    environment:
      PORT: 3005
      DATABASE_URL: "file:/app/prisma/dev.db"
      CORS_ORIGIN: "*"
      # Hub-Tickets: Name und Host-Recht kommen signiert vom Party-Server
      TREFFEN_TICKET_SECRET: ${TREFFEN_TICKET_SECRET:-}
    ports:
      - "3005:3005"
    networks:
      - party-net

  # =========================================================================
  # Spiel 4: Guess The Price - Frontend (React + Vite + Tailwind)
  # =========================================================================
  gtp-client:
    build:
      context: ./games/guess-the-price/apps/client
      dockerfile: Dockerfile
    container_name: gtp-client
    restart: unless-stopped
    ports:
      - "8088:8088"
    depends_on:
      - gtp-server
    networks:
      - party-net

  # =========================================================================
  # Optional: Monopoly (Amogolie) - Bei Bedarf zuschaltbar
  # =========================================================================
  monopoly:
    build:
      # Repo als Kontext: das Image baut den Client mit packages/boardgame-kit
      context: .
      dockerfile: games/monopoly/Dockerfile
    container_name: monopoly
    restart: unless-stopped
    environment:
      - TREFFEN_TICKET_SECRET=${TREFFEN_TICKET_SECRET:-}
    volumes:
      # Laufende Partien (SQLite) – überstehen Neustart, Update und Neubau des Containers
      - ./data/monopoly:/app/data
    ports:
      - "8090:8090"
    networks:
      - party-net

  # =========================================================================
  # Mensch ärgere dich nicht (Treffen-Spieltisch, 3D)
  # =========================================================================
  mensch:
    build:
      context: .
      dockerfile: games/mensch/Dockerfile
    container_name: mensch
    restart: unless-stopped
    environment:
      - TREFFEN_TICKET_SECRET=${TREFFEN_TICKET_SECRET:-}
    volumes:
      # Laufende Partien (SQLite) – überstehen Neustart, Update und Neubau des Containers
      - ./data/mensch:/app/data
    ports:
      - "8095:8095"
    networks:
      - party-net

  # =========================================================================
  # Schach (Treffen-Spieltisch, 3D)
  # =========================================================================
  schach:
    build:
      context: .
      dockerfile: games/schach/Dockerfile
    container_name: schach
    restart: unless-stopped
    environment:
      - TREFFEN_TICKET_SECRET=${TREFFEN_TICKET_SECRET:-}
    volumes:
      - ./data/schach:/app/data
    ports:
      - "8096:8096"
    networks:
      - party-net

  # =========================================================================
  # Mau-Mau (Treffen-Spieltisch, 3D-Karten)
  # =========================================================================
  maumau:
    build:
      context: .
      dockerfile: games/maumau/Dockerfile
    container_name: maumau
    restart: unless-stopped
    environment:
      - TREFFEN_TICKET_SECRET=${TREFFEN_TICKET_SECRET:-}
    volumes:
      - ./data/maumau:/app/data
    ports:
      - "8098:8098"
    networks:
      - party-net

networks:
  party-net:
    driver: bridge
