events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Dynamic DNS resolver for Docker / Podman networks
    resolver 127.0.0.11 10.89.0.1 valid=10s ipv6=off;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Map for WebSocket Upgrade header
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # =========================================================================
    # HTTP Server (Port 80): Serves PartyHub & All Game Locations
    # =========================================================================
    server {
        listen 80;
        server_name _;

        client_max_body_size 50M;

        # Allow Let's Encrypt domain renewal verification
        location /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
            allow all;
        }

        # 1. PartyHub Main Dashboard / Lobby
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # PartyHub Live WebSocket (Real-Time Sync across all devices)
        location /party-ws {
            set $party_ws http://party-server:3001;
            proxy_pass $party_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 2. Skribbl (Go)
        location = /skribbl {
            return 301 /skribbl/;
        }
        location /skribbl/ {
            set $skribbl_backend http://skribbl:8080;
            proxy_pass $skribbl_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 3. UNO / SunoS (Node.js)
        location = /uno {
            return 301 /uno/;
        }
        location /uno/ {
            set $uno_backend http://uno:8085;
            rewrite ^/uno/(.*) /$1 break;
            proxy_pass $uno_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # UNO WebSockets (/socket.io/)
        location /socket.io/ {
            set $uno_ws http://uno:8085;
            proxy_pass $uno_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 4. Codenames (Python/Flask)
        location = /codenames {
            return 301 /codenames/;
        }
        location /codenames/ {
            set $codenames_backend http://codenames:5000;
            rewrite ^/codenames/(.*) /$1 break;
            proxy_pass $codenames_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /codenames;
            proxy_set_header X-Script-Name /codenames;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 5. Monopoly
        location = /monopoly {
            return 301 /monopoly/;
        }
        location /monopoly/ {
            set $monopoly_backend http://monopoly:8090;
            rewrite ^/monopoly/(.*) /$1 break;
            proxy_pass $monopoly_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 5b. Mensch ärgere dich nicht
        location = /mensch {
            return 301 /mensch/;
        }
        location /mensch/ {
            set $mensch_backend http://mensch:8092;
            rewrite ^/mensch/(.*) /$1 break;
            proxy_pass $mensch_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 5c. Among Us
        location = /amongus {
            return 301 /amongus/;
        }
        location /amongus/ {
            set $amongus_backend http://amongus:8093;
            rewrite ^/amongus/(.*) /$1 break;
            proxy_pass $amongus_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 6. Guess The Price (Frontend)
        location = /price-guess {
            return 301 /price-guess/;
        }
        location /price-guess/ {
            set $gtp_client http://gtp-client:8088;
            rewrite ^/price-guess/(.*) /$1 break;
            proxy_pass $gtp_client;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Guess The Price (API & WebSockets)
        location /price-guess-api/ {
            set $gtp_api http://gtp-server:3005;
            rewrite ^/price-guess-api/(.*) /api/$1 break;
            proxy_pass $gtp_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /mp-ws {
            set $gtp_ws http://gtp-server:3005;
            proxy_pass $gtp_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }

    # =========================================================================
    # HTTPS Server (Port 443): SSL/TLS Encryption & Reverse Proxy
    # =========================================================================
    server {
        listen 443 ssl;
        server_name treffen.ddns.net localhost;

        # SSL Certificates (Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/treffen.ddns.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/treffen.ddns.net/privkey.pem;

        # Modern TLS Security Configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        client_max_body_size 50M;

        # 1. PartyHub Main Dashboard / Lobby
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
