events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Dynamic DNS resolver for Docker / Podman networks
    resolver 127.0.0.11 10.89.0.1 valid=10s ipv6=off;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Map for WebSocket Upgrade header
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Hinter Caddy das Original-Protokoll (https) weiterreichen, sonst $scheme
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # =========================================================================
    # HTTP Server (Port 80): Serves PartyHub & All Game Locations
    # =========================================================================
    server {
        listen 80;
        server_name _;

        # Allow Let's Encrypt domain renewal verification
        location /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
            allow all;
        }

        include /etc/nginx/treffen-locations.conf;
    }

    # HTTPS (443) – nur aktiv, wenn Zertifikate vorhanden (siehe 40-enable-ssl.sh)
    include /etc/nginx/ssl-enabled/*.conf;
}
