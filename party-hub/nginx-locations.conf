# =========================================================================
# Gemeinsame Locations für HTTP (80) und – falls Zertifikate vorhanden –
# HTTPS (443). Wird von nginx.conf und nginx-ssl.conf per include geladen.
# =========================================================================

client_max_body_size 50M;

# Build-/Konfigurationsdateien nicht aus dem Webroot ausliefern
location ~ (^/Dockerfile$|\.conf$|\.sh$) {
    return 404;
}

# 1. PartyHub Main Dashboard / Lobby
location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
}

# PartyHub Live WebSocket (Real-Time Sync across all devices)
location /party-ws {
    set $party_ws http://party-server:3001;
    proxy_pass $party_ws;
    include /etc/nginx/treffen-proxy.conf;
}

# 2. Skribbl (Go) – ROOT_PATH=/skribbl, Präfix bleibt erhalten
location = /skribbl {
    return 301 /skribbl/;
}
location /skribbl/ {
    set $skribbl_backend http://skribbl:8080;
    proxy_pass $skribbl_backend;
    include /etc/nginx/treffen-proxy.conf;
}

# 3. UNO / SunoS (Node.js)
location = /uno {
    return 301 /uno/;
}
location /uno/ {
    set $uno_backend http://uno:8085;
    rewrite ^/uno/(.*) /$1 break;
    proxy_pass $uno_backend;
    include /etc/nginx/treffen-proxy.conf;
}

# UNO WebSockets (/socket.io/)
location /socket.io/ {
    set $uno_ws http://uno:8085;
    proxy_pass $uno_ws;
    include /etc/nginx/treffen-proxy.conf;
}

# 4. Codenames (Python/Flask)
location = /codenames {
    return 301 /codenames/;
}
location /codenames/ {
    set $codenames_backend http://codenames:5000;
    rewrite ^/codenames/(.*) /$1 break;
    proxy_pass $codenames_backend;
    include /etc/nginx/treffen-proxy.conf;
    proxy_set_header X-Forwarded-Prefix /codenames;
    proxy_set_header X-Script-Name /codenames;
}

# 5. Monopoly
location = /monopoly {
    return 301 /monopoly/;
}
location /monopoly/ {
    set $monopoly_backend http://monopoly:8090;
    rewrite ^/monopoly/(.*) /$1 break;
    proxy_pass $monopoly_backend;
    include /etc/nginx/treffen-proxy.conf;
}

# 5b. Mensch ärgere dich nicht (Treffen-Spieltisch, 3D)
location = /mensch {
    return 301 /mensch/;
}
location /mensch/ {
    set $mensch_backend http://mensch:8095;
    rewrite ^/mensch/(.*) /$1 break;
    proxy_pass $mensch_backend;
    include /etc/nginx/treffen-proxy.conf;
}

# 5c. Schach (Treffen-Spieltisch, 3D)
location = /schach {
    return 301 /schach/;
}
location /schach/ {
    set $schach_backend http://schach:8096;
    rewrite ^/schach/(.*) /$1 break;
    proxy_pass $schach_backend;
    include /etc/nginx/treffen-proxy.conf;
}

# 6. Guess The Price (Frontend)
# Der Client wird mit base=/price-guess/ gebaut, daher Präfix NICHT entfernen
# (sonst leitet vite preview "/" wieder auf "/price-guess/" um → Schleife).
location = /price-guess {
    return 301 /price-guess/;
}
location /price-guess/ {
    set $gtp_client http://gtp-client:8088;
    proxy_pass $gtp_client;
    include /etc/nginx/treffen-proxy.conf;
}

# Guess The Price (REST API)
location /price-guess-api/ {
    set $gtp_api http://gtp-server:3005;
    rewrite ^/price-guess-api/(.*) /api/$1 break;
    proxy_pass $gtp_api;
    include /etc/nginx/treffen-proxy.conf;
}

# Guess The Price (Socket.io, path=/price-guess-socket, Namespace /mp-ws)
location /price-guess-socket/ {
    set $gtp_ws http://gtp-server:3005;
    proxy_pass $gtp_ws;
    include /etc/nginx/treffen-proxy.conf;
}
