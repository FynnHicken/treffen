# =========================================================================
# HTTPS Server (Port 443) – wird von 40-enable-ssl.sh nur aktiviert, wenn
# unter /etc/letsencrypt/live/<SSL_DOMAIN>/ Zertifikate liegen.
# Ohne Zertifikate (frischer Checkout, Caddy-Modus) startet nginx nur auf 80.
# =========================================================================
server {
    listen 443 ssl;
    server_name __SSL_DOMAIN__ localhost;

    ssl_certificate /etc/letsencrypt/live/__SSL_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__SSL_DOMAIN__/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/treffen-locations.conf;
}
