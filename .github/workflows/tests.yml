# Läuft bei jedem Push und Pull Request. Rot = bitte nicht deployen, erst reparieren.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monopoly:
    name: Monopoly (Regeln, Auth, Bots, Einstellungen)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Testsuite (Docker)
        run: ./games/monopoly/tests/run_tests.sh

  mensch:
    name: Mensch ärgere dich nicht
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: games/mensch/requirements.txt
      - run: pip install -r games/mensch/requirements.txt
      - name: Tests
        working-directory: /tmp
        run: python -I "$GITHUB_WORKSPACE/games/mensch/tests/test_mensch.py"

  hub:
    name: Hub (Sync-Server, JS-Syntax)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            party-server/package-lock.json
            games/monopoly/client/package-lock.json
      - name: Sync-Server-Tests
        working-directory: party-server
        run: npm ci && npm test
      - name: Monopoly-Client (TypeScript-Prüfung + Vite-Build)
        working-directory: games/monopoly/client
        run: npm ci && npm run build
      - name: JS-Syntax (Hub)
        run: |
          for f in party-hub/*.js games/mensch/static/js/*.js; do
            [ -f "$f" ] || continue
            node --check "$f" || { echo "::error file=$f::Syntaxfehler"; exit 1; }
          done

  tabletop:
    name: Spieltisch (Server, Client, Browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: packages/tabletop-server/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: games/mensch/client/package-lock.json
      - run: pip install -r packages/tabletop-server/requirements.txt
      - name: Server-Tests (Sitzplätze, Host, Präsenz, Reconnect)
        working-directory: /tmp
        run: python -I "$GITHUB_WORKSPACE/packages/tabletop-server/tests/test_tabletop_ws.py"
      - name: Mensch-3D-Client (TypeScript-Prüfung + Vite-Build)
        working-directory: games/mensch/client
        run: npm ci && npm run build
      - name: Browser-Rauchtest (zwei Spieler, Präsenz, Render-on-Demand)
        run: |
          (cd /tmp && python -u "$GITHUB_WORKSPACE/games/mensch/server3d/main.py" > /tmp/tisch.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8095/api/health >/dev/null && break; sleep 1; done
          docker build -q -t treffen-ui-test -f games/monopoly/tests/ui/Containerfile games/monopoly/tests/ui
          mkdir -p /tmp/tisch-shots
          docker run --rm --network=host -v "$PWD/games/mensch":/work:ro -v /tmp/tisch-shots:/shots -w /work treffen-ui-test \
            python -u tests/ui/tisch_smoke.py http://127.0.0.1:8095 /shots
      - name: Screenshots hochladen
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: spieltisch-screenshots
          path: /tmp/tisch-shots
          if-no-files-found: ignore
      - name: Server-Log bei Fehler
        if: failure()
        run: tail -60 /tmp/tisch.log

  build:
    name: Docker-Images & Nginx-Konfiguration
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Compose-Datei gültig
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.caddy.yml config -q
      - name: Hub-Nginx-Konfiguration (nginx -t)
        run: |
          docker build -q -t treffen-hub-test party-hub
          docker run --rm treffen-hub-test nginx -t
      - name: Alle Images bauen
        run: docker compose -f docker-compose.yml build
      - name: Hub im Browser (Beitreten, Host-Einstellungen, Abstimmung)
        run: |
          docker compose -f docker-compose.yml up -d party-server partyhub
          docker build -q -t treffen-ui-test -f games/monopoly/tests/ui/Containerfile games/monopoly/tests/ui
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
          docker run --rm --network=host -v "$PWD/party-hub/tests":/t:ro treffen-ui-test python -u /t/browser_smoke.py http://127.0.0.1:8000
      - name: Monopoly im Browser über den Hub-Pfad /monopoly/ (Lobby, Bots, Würfeln, Menüs)
        run: |
          docker compose -f docker-compose.yml up -d monopoly
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/monopoly/ >/dev/null && break; sleep 1; done
          mkdir -p /tmp/shots
          docker run --rm --network=host -v "$PWD/games/monopoly":/work:ro -v /tmp/shots:/shots -w /work treffen-ui-test \
            python -u tests/ui/walkthrough.py http://127.0.0.1:8000/monopoly /shots desktop,handy --check
      - name: Screenshots hochladen
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: monopoly-screenshots
          path: /tmp/shots
          if-no-files-found: ignore
      - name: Logs bei Fehler
        if: failure()
        run: docker compose -f docker-compose.yml logs --tail=80 party-server partyhub monopoly
      - name: Shell-Skripte (Syntax)
        run: for f in start.sh stop.sh fly_entrypoint.sh party-hub/40-enable-ssl.sh party-hub/15-treffen-resolver.sh; do bash -n "$f"; done
